name: Android Build, Test, and APK

on:
  push:
    branches: [main, nissan-cvt7-live-data]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, test, and build signed debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify Gradle configuration
        run: gradle --no-daemon help

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon lintDebug

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing or unavailable ANDROID_DEBUG_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify keystore certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass "$KEYSTORE_PASSWORD"

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANDROID_DEBUG_KEYSTORE: ${{ github.workspace }}/.github-signing/debug.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_MAPS_API_KEY" || { echo "Missing GOOGLE_MAPS_API_KEY secret"; exit 1; }
          mkdir -p "$(dirname "$ANDROID_DEBUG_KEYSTORE")"
          cp "$HOME/.android/debug.keystore" "$ANDROID_DEBUG_KEYSTORE"
          gradle --no-daemon assembleDebug

      - name: Verify APK signing certificate matches keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "APK not found: $APK"; exit 1; }
          EXPECTED=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass "$KEYSTORE_PASSWORD" |
            awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" |
            awk -F': ' '/certificate SHA-1 digest:/{print $2; exit}' |
            tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "Keystore SHA-1: $EXPECTED"
          echo "APK SHA-1:      $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL" || {
            echo "APK signing certificate does not match the configured keystore"
            exit 1
          }

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OBDII_Tools-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish directly installable APK release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          VERSION_NAME="${VERSION_NAME:-unknown}"
          BUILD_TIMESTAMP=$(date -u +'%Y%m%d-%H%M%S-UTC')
          SHORT_SHA="${COMMIT_SHA:0:7}"
          ASSET_NAME="OBDII_Tools-v${VERSION_NAME}-build${BUILD_NUMBER}-${BUILD_TIMESTAMP}-${SHORT_SHA}.apk"
          TAG="test-build-${BUILD_NUMBER}-${BUILD_TIMESTAMP}"
          mkdir -p release-assets
          cp "$APK" "release-assets/$ASSET_NAME"
          cp "$APK" "release-assets/OBDII_Tools-latest.apk"
          gh release create "$TAG" "release-assets/$ASSET_NAME" "release-assets/OBDII_Tools-latest.apk" --title "OBDII Tools v${VERSION_NAME} - build ${BUILD_NUMBER}" --notes "Automated signed debug/test APK. Commit: ${COMMIT_SHA}. Build: ${BUILD_NUMBER}. Built: ${BUILD_TIMESTAMP}." --target "$COMMIT_SHA"
