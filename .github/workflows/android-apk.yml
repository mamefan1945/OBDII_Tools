name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_DEBUG_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify keystore certificate
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass "$KEYSTORE_PASSWORD"

      - name: Build debug APK
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANDROID_DEBUG_KEYSTORE: ${{ github.workspace }}/.github-signing/debug.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$GOOGLE_MAPS_API_KEY" || { echo "Missing GOOGLE_MAPS_API_KEY secret"; exit 1; }
          mkdir -p "$(dirname "$ANDROID_DEBUG_KEYSTORE")"
          cp "$HOME/.android/debug.keystore" "$ANDROID_DEBUG_KEYSTORE"
          gradle --no-daemon assembleDebug

      - name: Verify APK signing certificate matches keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "APK not found: $APK"; exit 1; }
          EXPECTED=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass "$KEYSTORE_PASSWORD" |
            awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" |
            awk -F': ' '/certificate SHA-1 digest:/{print $2; exit}' |
            tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "Keystore SHA-1: $EXPECTED"
          echo "APK SHA-1:      $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL" || {
            echo "APK signing certificate does not match the configured keystore"
            exit 1
          }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OBDII_Tools-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
