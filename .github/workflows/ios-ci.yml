name: iOS CI

on:
  push:
    branches: [main, ios-foundation]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test iOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/OBDIITools.xcodeproj \
            -scheme OBDIITools \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m 1 -E 'iPhone .*\(' | sed -E 's/^[[:space:]]*([^()]*) \(.*/\1/' | xargs)
          if [ -z "$DEVICE" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi
          xcodebuild \
            -project ios/OBDIITools.xcodeproj \
            -scheme OBDIITools \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Package simulator build
        run: |
          APP_PATH=$(find build/ios-derived/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" build/OBDIITools-iOS-Simulator.zip

      - name: Capture app UI screenshots
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m 1 -E 'iPhone .*\(' | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          test -n "$DEVICE_ID"
          APP_PATH=$(find build/ios-derived/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          mkdir -p build/ui-screenshots
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          for TAB in dashboard vehicles live-data diagnostics more; do
            xcrun simctl terminate "$DEVICE_ID" com.obdiitools.ios 2>/dev/null || true
            xcrun simctl install "$DEVICE_ID" "$APP_PATH"
            xcrun simctl launch "$DEVICE_ID" com.obdiitools.ios -screenshot-tab "$TAB"
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "build/ui-screenshots/$TAB.png"
          done
          ditto -c -k --sequesterRsrc --keepParent build/ui-screenshots build/OBDIITools-iOS-UI-Screenshots.zip

      - name: Build unsigned iPhone device app
        run: |
          xcodebuild \
            -project ios/OBDIITools.xcodeproj \
            -scheme OBDIITools \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device-derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iPhone IPA for personal signing
        run: |
          APP_PATH=$(find build/ios-device-derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload ../OBDII_Tools-unsigned.ipa

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: OBDII-Tools-iPhone-Unsigned-${{ github.run_number }}
          path: build/OBDII_Tools-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: OBDIITools-iOS-Simulator-${{ github.run_number }}
          path: build/OBDIITools-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: OBDIITools-iOS-UI-Screenshots-${{ github.run_number }}
          path: build/OBDIITools-iOS-UI-Screenshots.zip
          if-no-files-found: error
          retention-days: 14
